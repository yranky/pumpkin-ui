variables: 
    BUILD_DOCS: 'pnpm run build:mobile_docs -c mobile/.vuepress/config/gitlab.ts'
    BUILD_DEMO: 'pnpm run build:demo_mobile --mode=gitlab'
    BUILD_DOCS_EDGEONE: 'pnpm run build:mobile_docs -c mobile/.vuepress/config/edgeone.ts'
    BUILD_DEMO_EDGEONE: 'pnpm run build:demo_mobile --mode=edgeone'
cache: 
    paths: 
        - node_modules/
        - demo/mobile/node_modules
        - docs/node_modules
        - packages/mobile/node_modules
        - packages/uni-vue3/node_modules
        - packages/use/node_modules
        - packages/utils/node_modules
        - demo/mobile/dist
        - docs/mobile/.vuepress/dist
stages: 
    - install
    - build
    - deploy
    - build_edgeone
    - publish
install: 
    stage: install
    script: 
        - 'pnpm install'
    only:
        - tags
build: 
    stage: build
    script: 
        - $BUILD_DOCS
        - $BUILD_DEMO
        - ls
    only:
        - tags
build_edgeone: 
    stage: build_edgeone
    script: 
        - $BUILD_DOCS_EDGEONE
        - $BUILD_DEMO_EDGEONE
        - ls
        - rm -rf edgeone/*
        - mkdir -p edgeone/demo
        - ls
        - mv demo/mobile/dist/* edgeone/demo
        - mv docs/mobile/.vuepress/dist/* edgeone/
        - edgeone pages deploy edgeone -n pumpkin-ui -t $EDGEONE_TOKEN
    only:
        - tags
pages: 
    stage: deploy
    script: 
        - rm -rf public/*
        - mkdir -p public/demo
        - ls
        - mv demo/mobile/dist/* public/demo
        - mv docs/mobile/.vuepress/dist/* public/
    artifacts: 
        paths: 
            - public
    only:
        - tags
publish:
    stage: publish
    script: 
        - npm run build:release
        - npm run publish:release
        - ls
    only:
        - tags
    